services:
  app:
    build:
      context: .
      target: development
    command: pnpm dev --hostname 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://traveltrove:traveltrove@db:5432/traveltrove
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-development-secret-change-before-deploying
      LOG_LEVEL: debug
      MEDIA_ROOT: /app/.local-data/media
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
      - media_data:/app/.local-data/media

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: traveltrove
      POSTGRES_USER: traveltrove
      POSTGRES_PASSWORD: traveltrove
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveltrove -d traveltrove"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_18_data:/var/lib/postgresql

  adminer:
    image: adminer:6.3.0-standalone
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  node_modules:
  pnpm_store:
  media_data:
  postgres_18_data:
