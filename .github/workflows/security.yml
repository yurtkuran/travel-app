name: Security scans

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan committed files for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          scan-ref: .
          scan-type: fs
          scanners: secret

      - name: Build production image without runtime secrets
        run: docker build --target production --tag traveltrove:security-scan .

      - name: Scan production image for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          image-ref: traveltrove:security-scan
          scan-type: image
          scanners: secret
