name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: traveltrove_test
          POSTGRES_USER: traveltrove
          POSTGRES_PASSWORD: traveltrove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traveltrove -d traveltrove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://traveltrove:traveltrove@localhost:5432/traveltrove_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production Compose configuration
        run: >-
          docker compose
          --env-file .env.production.example
          -f compose.production.yaml
          config --quiet
      - run: pnpm test:migrations
      - name: Test database and media backup restoration
        run: pnpm test:backup-restore
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Build production application
        run: pnpm build
        env:
          NODE_ENV: production

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: traveltrove_test
          POSTGRES_USER: traveltrove
          POSTGRES_PASSWORD: traveltrove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traveltrove -d traveltrove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://traveltrove:traveltrove@localhost:5432/traveltrove_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
